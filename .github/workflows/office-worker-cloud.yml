name: Office worker (cloud)

# Runs the reviewed Agents Office executor in the cloud: no PC required. Every fifteen minutes GitHub
# starts a clean, isolated machine; `office-worker-once` takes the exclusive PostgreSQL ownership lock
# (never stolen), refuses to run while the PC worker still reports presence, runs the same reviewed
# office cycle for at most 13 minutes, never claims work without its full lease inside that budget,
# never replays uncertain or fenced work, then releases ownership and exits. It stays review-only:
# no publication, deployment, credentials, messages or KONG changes.
#
# Scheduled workflows only run from the default branch, so this file must also live on `main`; it
# executes the office source named by the repository variable OFFICE_SOURCE_REF (the production branch).
#
# This file is also the single automatic path for the Software Factory (`factory-once` job below),
# gated by SOFTWARE_FACTORY_CLOUD_ENABLED. GitHub's own `schedule` event has proven unreliable for
# this repository (it never fired), and an external cron dispatches this workflow every 15 minutes
# without inputs, so the factory cadence is decided here by the clock: in `auto` mode (the default,
# used by schedules and by dispatches without inputs) the office always runs and the `factory-gate`
# job also lets the factory run when the current UTC hour is even and the minute is below 30. That is
# two chances per two hours, so one missed external tick does not skip the factory; a second pass in
# the same window just continues queued work or exits idle in seconds (the factory is idempotent and
# its concurrency group serializes runs). Explicit `target=office|factory|both` dispatches bypass the
# clock. `software-factory-cloud.yml` is kept as a manual-only fallback with no schedule.

# Single trigger: the external cron dispatches this workflow every 15 minutes. GitHub's own `schedule`
# event used to be listed too; it began firing sporadically on top of the dispatch, so the office ran
# twice in the same window and the second round collided on the shared council lock (CODE_55P03).
# Do not add `schedule` back without removing the external dispatcher.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which worker to run: auto (default: office, plus the factory in its two-hourly window), office, factory or both"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - office
          - factory
          - both

permissions:
  contents: read

# Factory admission of system-authored office self-heal orders. Overrides ONLY autoAdmit.systemOrders of
# the private operator config (and only when that config already has autoAdmit); nothing else in the
# secret can be changed from here. 'true' by default so the owner does not have to edit the secret.
env:
  FACTORY_AUTO_ADMIT_SYSTEM_ORDERS: ${{ vars.FACTORY_AUTO_ADMIT_SYSTEM_ORDERS || 'true' }}
  # Optional owner override of the daily draft-PR cap (1..10); empty keeps the private config value.
  FACTORY_DRAFT_PRS_PER_DAY: ${{ vars.FACTORY_DRAFT_PRS_PER_DAY || '' }}

jobs:
  office-once:
    # Never on forks; only scheduled or manual runs of this repository can see the office secrets.
    # Setting OFFICE_WORKER_CLOUD_ENABLED to anything but 'true' is the persistent maintenance pause.
    # Skipped only on dispatches that ask for the factory alone; a dispatch without inputs (external
    # cron, target=auto) still runs the office.
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops-reminder' &&
      vars.OFFICE_WORKER_CLOUD_ENABLED == 'true' &&
      inputs.target != 'factory'
    concurrency:
      group: office-worker-cloud
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # 13-minute run budget plus startup and bounded settlement/cleanup.
    timeout-minutes: 25
    steps:
      - name: Check out the office source in production
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.OFFICE_SOURCE_REF }}
          persist-credentials: false

      - name: Verify the reviewed entrypoint exists
        run: test -f script/office-worker-once.ts && test -f server/office-worker-once.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Hosted runners use CPU; optional CUDA downloads must not block startup.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Install private configuration outside the checkout
        env:
          OPENAI_SHARED_CREDIT_CONFIG_JSON: ${{ secrets.OPENAI_SHARED_CREDIT_CONFIG_JSON }}
          # Read-only: derives the credit configuration from the ledger of this scope in the database
          # (script/shared-credit-config-from-db.ts). The derived config wins; the secret above is only
          # the fallback while that ledger does not exist yet. Defaults = the 2026-11-19 grant.
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          OFFICE_SHARED_CREDIT_SCOPE: ${{ vars.OFFICE_SHARED_CREDIT_SCOPE || 'openai-2026-11-19' }}
          OFFICE_SHARED_CREDIT_PRICING_MODEL: ${{ vars.OFFICE_SHARED_CREDIT_PRICING_MODEL || 'gpt-6.1-sol' }}
          OFFICE_SHARED_CREDIT_INPUT_USD_PER_MILLION: ${{ vars.OFFICE_SHARED_CREDIT_INPUT_USD_PER_MILLION || '2' }}
          OFFICE_SHARED_CREDIT_OUTPUT_USD_PER_MILLION: ${{ vars.OFFICE_SHARED_CREDIT_OUTPUT_USD_PER_MILLION || '10' }}
          OFFICE_SHARED_CREDIT_PRICING_VALID_UNTIL: ${{ vars.OFFICE_SHARED_CREDIT_PRICING_VALID_UNTIL || '2026-12-31T00:00:00Z' }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/office-config"
          mkdir -p "$dir"
          # Only needed when role academy, capability training or shared credits are enabled.
          # 1) Derived from the configured scope's ledger (prints only a static status line or code).
          # 2) Otherwise the OPENAI_SHARED_CREDIT_CONFIG_JSON secret, unchanged.
          if [ -n "${OFFICE_SHARED_CREDIT_SCOPE:-}" ] && [ -f script/shared-credit-config-from-db.ts ] &&
             node --import tsx script/shared-credit-config-from-db.ts "--out=$dir/shared-credit.json"; then
            echo "shared credit config: derived from the configured ledger"
          elif [ -n "$OPENAI_SHARED_CREDIT_CONFIG_JSON" ]; then
            rm -f "$dir/shared-credit.json"
            printf '%s' "$OPENAI_SHARED_CREDIT_CONFIG_JSON" > "$dir/shared-credit.json"
            echo "shared credit config: secret fallback"
          fi
          if [ -s "$dir/shared-credit.json" ]; then
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$dir/shared-credit.json"
            echo "OFFICE_SHARED_CREDIT_FILE=$dir/shared-credit.json" >> "$GITHUB_ENV"
          fi

      - name: Run the office executor once (bounded)
        env:
          NODE_ENV: production
          OFFICE_WORKER_CLOUD_ENABLED: ${{ vars.OFFICE_WORKER_CLOUD_ENABLED }}
          # Must be a direct (session) PostgreSQL URL: the exclusive ownership lock is a session advisory lock.
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          OPENAI_API_KEY: ${{ secrets.OFFICE_OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OFFICE_GITHUB_TOKEN }}
          # Read-only KONG operations/city evidence for the council's KONG rounds (same token as the web app).
          KONG_OFFICE_READ_TOKEN: ${{ secrets.KONG_OFFICE_READ_TOKEN }}
          OFFICE_EXPECTED_WEB_REVISION: ${{ vars.OFFICE_EXPECTED_WEB_REVISION }}
          OFFICE_OPENAI_MODEL: ${{ vars.OFFICE_OPENAI_MODEL }}
          OFFICE_OPENAI_MONTHLY_TOKEN_LIMIT: ${{ vars.OFFICE_OPENAI_MONTHLY_TOKEN_LIMIT }}
          OFFICE_OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OFFICE_OPENAI_MAX_OUTPUT_TOKENS }}
          OFFICE_ACADEMY_PREPARATION_ENABLED: ${{ vars.OFFICE_ACADEMY_PREPARATION_ENABLED || 'false' }}
          OFFICE_ACADEMY_EXECUTION_ENABLED: ${{ vars.OFFICE_ACADEMY_EXECUTION_ENABLED || 'false' }}
          OFFICE_REVIEW_BENCHMARK_PROMOTION_ENABLED: ${{ vars.OFFICE_REVIEW_BENCHMARK_PROMOTION_ENABLED || 'false' }}
          OFFICE_INTERNAL_WORK_ENABLED: ${{ vars.OFFICE_INTERNAL_WORK_ENABLED || 'false' }}
          OFFICE_ROLE_WORK_ENABLED: ${{ vars.OFFICE_ROLE_WORK_ENABLED || 'false' }}
          OFFICE_WEB_SOURCES_ENABLED: ${{ vars.OFFICE_WEB_SOURCES_ENABLED || 'false' }}
          OFFICE_WEB_SOURCE_ORIGIN: ${{ vars.OFFICE_WEB_SOURCE_ORIGIN }}
          OFFICE_ROLE_ACADEMY_ENABLED: ${{ vars.OFFICE_ROLE_ACADEMY_ENABLED || 'false' }}
          OFFICE_ROLE_ACADEMY_DAILY_PAIRS: ${{ vars.OFFICE_ROLE_ACADEMY_DAILY_PAIRS }}
          OFFICE_CAPABILITY_TRAINING_ENABLED: ${{ vars.OFFICE_CAPABILITY_TRAINING_ENABLED || 'false' }}
          OFFICE_CAPABILITY_MAX_CALLS_PER_DAY: ${{ vars.OFFICE_CAPABILITY_MAX_CALLS_PER_DAY }}
          OPENAI_SHARED_CREDITS_REQUIRED: ${{ vars.OFFICE_SHARED_CREDITS_REQUIRED || 'false' }}
          # Office self-heal (finding -> order -> factory -> re-audit). On unless the variable is 'false'.
          # No fixed daily order cap: the daily credit pacer decides (an optional variable can still cap it).
          OFFICE_SELF_HEAL_ENABLED: ${{ vars.OFFICE_SELF_HEAL_ENABLED || 'true' }}
          OFFICE_SELF_HEAL_MAX_ORDERS_PER_DAY: ${{ vars.OFFICE_SELF_HEAL_MAX_ORDERS_PER_DAY }}
          # Daily credit pacer: notify the owner after this many consecutive overspent days (default 3).
          OFFICE_CREDIT_OVERSPEND_ALERT_DAYS: ${{ vars.OFFICE_CREDIT_OVERSPEND_ALERT_DAYS || '3' }}
          # Database cost: exit after this many seconds without claiming a task (default 120; 0 = run to
          # the deadline as before) and cap the run length (7..13 minutes, default 13).
          OFFICE_RUN_IDLE_EXIT_SECONDS: ${{ vars.OFFICE_RUN_IDLE_EXIT_SECONDS }}
          OFFICE_RUN_MAX_MINUTES: ${{ vars.OFFICE_RUN_MAX_MINUTES }}
        run: |
          set -euo pipefail
          if [ -n "${OFFICE_SHARED_CREDIT_FILE:-}" ]; then export OPENAI_SHARED_CREDIT_CONFIG="$OFFICE_SHARED_CREDIT_FILE"; fi
          # 15 minutes: the worker's own 13-minute budget, then SIGTERM for bounded settlement.
          timeout --signal=TERM --kill-after=3m 15m node --import tsx script/office-worker-once.ts

      - name: Remove private configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/office-config"

  notify:
    # Owner notification for the daily credit pacer, isolated in its own job so that issues: write is
    # never granted to the office executor. contents: read is only for the checkout of this private
    # repository. Read-only on the database; at most one `budget` issue per alert (fixed text + numbers).
    needs: office-once
    if: ${{ !cancelled() && needs.office-once.result != 'skipped' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Check out the office source in production
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.OFFICE_SOURCE_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Notify the owner of credit pacing alerts
        env:
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f script/credit-pacer-notify.ts ]; then node --import tsx script/credit-pacer-notify.ts; fi

  factory-gate:
    # Decides whether this run includes the factory. Never on forks; skipped (and so is the factory)
    # unless SOFTWARE_FACTORY_CLOUD_ENABLED is exactly 'true'.
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops-reminder' &&
      vars.SOFTWARE_FACTORY_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          # Empty on schedule events; 'auto' on dispatches without inputs.
          TARGET: ${{ inputs.target || 'auto' }}
        run: |
          set -euo pipefail
          hour=$((10#$(date -u +%H))); minute=$((10#$(date -u +%M)))
          case "$TARGET" in
            factory|both) run=true ;;
            auto) if [ $((hour % 2)) -eq 0 ] && [ "$minute" -lt 30 ]; then run=true; else run=false; fi ;;
            *) run=false ;;
          esac
          echo "target=$TARGET utc=$(date -u +%H:%M) factory=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  factory-once:
    # Setting SOFTWARE_FACTORY_CLOUD_ENABLED to anything but 'true' keeps the factory paused (the gate
    # is skipped). Runs on dispatches with target factory|both, or in the two-hourly window (auto).
    needs: factory-gate
    if: needs.factory-gate.outputs.run == 'true'
    concurrency:
      group: software-factory-cloud
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # 30-minute run budget plus startup and bounded settlement/cleanup.
    timeout-minutes: 45
    steps:
      - name: Check out the factory source in production
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.FACTORY_SOURCE_REF || vars.OFFICE_SOURCE_REF }}
          persist-credentials: false

      - name: Verify the reviewed entrypoint exists
        run: test -f script/software-factory-once.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The factory also runs on a CPU-only hosted runner.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Install private configuration outside the checkout
        env:
          OPENAI_SHARED_CREDIT_CONFIG_JSON: ${{ secrets.OPENAI_SHARED_CREDIT_CONFIG_JSON }}
          SOFTWARE_FACTORY_OPERATOR_CONFIG_JSON: ${{ secrets.SOFTWARE_FACTORY_OPERATOR_CONFIG_JSON }}
          # Read-only: derives the credit configuration from the ledger of this scope in the same
          # database the factory run uses (script/shared-credit-config-from-db.ts). The derived config
          # wins; the secret above is only the fallback while that ledger does not exist yet.
          DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL || secrets.OFFICE_DATABASE_URL }}
          OFFICE_SHARED_CREDIT_SCOPE: ${{ vars.OFFICE_SHARED_CREDIT_SCOPE || 'openai-2026-11-19' }}
          OFFICE_SHARED_CREDIT_PRICING_MODEL: ${{ vars.OFFICE_SHARED_CREDIT_PRICING_MODEL || 'gpt-6.1-sol' }}
          OFFICE_SHARED_CREDIT_INPUT_USD_PER_MILLION: ${{ vars.OFFICE_SHARED_CREDIT_INPUT_USD_PER_MILLION || '2' }}
          OFFICE_SHARED_CREDIT_OUTPUT_USD_PER_MILLION: ${{ vars.OFFICE_SHARED_CREDIT_OUTPUT_USD_PER_MILLION || '10' }}
          OFFICE_SHARED_CREDIT_PRICING_VALID_UNTIL: ${{ vars.OFFICE_SHARED_CREDIT_PRICING_VALID_UNTIL || '2026-12-31T00:00:00Z' }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/factory-config"
          mkdir -p "$dir"
          test -n "$SOFTWARE_FACTORY_OPERATOR_CONFIG_JSON"
          # 1) Derived from the configured scope's ledger (prints only a static status line or code).
          # 2) Otherwise the OPENAI_SHARED_CREDIT_CONFIG_JSON secret, unchanged.
          if [ -n "${OFFICE_SHARED_CREDIT_SCOPE:-}" ] && [ -f script/shared-credit-config-from-db.ts ] &&
             node --import tsx script/shared-credit-config-from-db.ts "--out=$dir/shared-credit.json"; then
            echo "shared credit config: derived from the configured ledger"
          elif [ -n "$OPENAI_SHARED_CREDIT_CONFIG_JSON" ]; then
            rm -f "$dir/shared-credit.json"
            printf '%s' "$OPENAI_SHARED_CREDIT_CONFIG_JSON" > "$dir/shared-credit.json"
            echo "shared credit config: secret fallback"
          fi
          test -s "$dir/shared-credit.json"
          printf '%s' "$SOFTWARE_FACTORY_OPERATOR_CONFIG_JSON" > "$dir/operator.json"
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' "$dir/shared-credit.json" "$dir/operator.json"
          echo "FACTORY_CONFIG_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run the factory once (exits when idle)
        env:
          NODE_ENV: production
          SOFTWARE_FACTORY_ENABLED: "true"
          SOFTWARE_FACTORY_STORAGE_BACKEND: postgres
          AGENT_COUNCIL_STORAGE: postgres
          OPENAI_SHARED_CREDITS_REQUIRED: "true"
          # Factory-specific secrets win; otherwise reuse the office ones (same database, owner and ledger).
          DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL || secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.FACTORY_OWNER_ID || secrets.OFFICE_OWNER_ID }}
          SOFTWARE_FACTORY_OWNER_ID: ${{ secrets.FACTORY_OWNER_ID || secrets.OFFICE_OWNER_ID }}
          OPENAI_API_KEY: ${{ secrets.FACTORY_OPENAI_API_KEY || secrets.OFFICE_OPENAI_API_KEY }}
          # Optional Claude fallback when the OpenAI shared credit is unavailable/exhausted (absent key = unchanged behavior).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_ANTHROPIC_FALLBACK_ENABLED: ${{ vars.FACTORY_ANTHROPIC_FALLBACK_ENABLED }}
          FACTORY_ANTHROPIC_MONTHLY_BUDGET_USD: ${{ vars.FACTORY_ANTHROPIC_MONTHLY_BUDGET_USD }}
          SOFTWARE_FACTORY_GITHUB_TOKEN: ${{ secrets.SOFTWARE_FACTORY_GITHUB_TOKEN }}
          # Optional office handoff: only the exact string 'true' enqueues one read-only office review per verified draft PR head.
          SOFTWARE_FACTORY_OFFICE_REVIEW_ENABLED: ${{ vars.SOFTWARE_FACTORY_OFFICE_REVIEW_ENABLED || 'false' }}
          # Optional: score factory stage outcomes as office careers (lives, presence, successors).
          SOFTWARE_FACTORY_OFFICE_CAREERS_ENABLED: ${{ vars.SOFTWARE_FACTORY_OFFICE_CAREERS_ENABLED || 'false' }}
          # Office self-heal (finding -> order -> factory -> re-audit). On unless the variable is 'false'.
          OFFICE_SELF_HEAL_ENABLED: ${{ vars.OFFICE_SELF_HEAL_ENABLED || 'true' }}
          OFFICE_SELF_HEAL_MAX_ORDERS_PER_DAY: ${{ vars.OFFICE_SELF_HEAL_MAX_ORDERS_PER_DAY }}
        run: |
          set -euo pipefail
          export OPENAI_SHARED_CREDIT_CONFIG="$FACTORY_CONFIG_DIR/shared-credit.json"
          export SOFTWARE_FACTORY_OPERATOR_CONFIG="$FACTORY_CONFIG_DIR/operator.json"
          # 32 minutes: the worker's own 30-minute budget, then SIGTERM for bounded settlement.
          timeout --signal=TERM --kill-after=5m 32m node --import tsx script/software-factory-once.ts

      - name: Remove private configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-config"
