name: News autopilot heartbeat

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEWS_HEALTH_URL: https://robplanner.replit.app/api/health
    steps:
      - name: Wake deployed Replit app
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            "$NEWS_HEALTH_URL"
