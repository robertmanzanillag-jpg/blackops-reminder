name: Factory operations (manual)

# Operator actions for the Software Factory database, run from the reviewed production source
# (vars.OFFICE_SOURCE_REF) with the same database secret the office worker uses, so nobody has to
# paste a connection string into a shell.
#
#   status           read-only (BEGIN TRANSACTION READ ONLY, always rolled back)
#   migrate-dry-run  creates the factory tables inside a transaction, verifies them, rolls back
#   migrate-apply    commits the additive factory schema; requires confirm=APLICAR
#   office-status    read-only office diagnostic (script/office-status.ts), always rolled back
#   office-credit-audit read-only primary snapshot; counts only, never recovery authority
#   credit-new       creates the NEW shared OpenAI credit ledger for the owner-approved 2026-11-19
#                    grant ($200, scope openai-2026-11-19); requires confirm=APLICAR. Refuses
#                    (CREDIT_STORAGE_ALREADY_EXISTS) when that scope already exists, so a repeat is a
#                    no-op. Prints only the ledger status JSON, never the grant/CONFIG_JSON line.
#   credit-reconcile dry run by default: lists `unknown` reservations of the shared ledger
#                    (vars.OFFICE_SHARED_CREDIT_SCOPE, default openai-2026-11-19) as consumer/kind/
#                    amount/createdAt only. With confirm=APLICAR it settles each one CONSERVATIVELY
#                    at its full reserved amount (assumed spent, never refunded) and appends one
#                    audit event. A repeat finds nothing and writes nothing.
#   api-month-init   dry run by default: shows whether the current UTC month of the Factory API
#                    authority is initialized; with confirm=APLICAR calls the explicit, immutable
#                    initializeMonth(owner, api_month, api_fixed_usd).
#   api-checkpoint   dry run by default: prints the exact checkpointApiMonth input (microUSD, counts,
#                    evidence SHA-256 only, never the evidence text) and any refusal; with
#                    confirm=APLICAR writes it. Refuses if the quarantined News hold is still unknown
#                    and not recorded as an external unknown. See docs/factory-api-budget-authority.md.
#   api-unknown-resolve dry run by default. Empty api_hold_id: every unresolved `unknown` API-ledger
#                    reservation plus the unknown Factory jobs tied to it (reservation.parent.jobId).
#                    api_hold_id=news (or a validated id): that one hold across shared credit ledger /
#                    API authority / external checkpoint. Prints the plan (ledgers, microUSD, digests only).
#                    Tied jobs go to terminal `failed` at ceil(children microUSD) cents via the
#                    existing stopped reconciliation (which pauses the factory, as reconcile always does). With
#                    confirm=APLICAR it settles it CONSERVATIVELY at its full reserved amount and appends
#                    an immutable receipt (evidence SHA-256 + timestamp). Never releases or replays.
#
# This repository is public, so job logs are public: the scripts print only static JSON
# (table presence, pause flag, budget/job counts) and static error codes, never connection
# details. office-credit-audit reports only cross-ledger counts/booleans. office-status prints only
# enum codes, counts, dates and ages (no user/worker/job ids, URLs, free text, prompts or answers).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status | migrate-dry-run | migrate-apply | office-status | office-credit-audit | sources-migrate-dry-run | sources-migrate-apply | credit-new | credit-reconcile | api-month-init | api-checkpoint | api-unknown-resolve"
        required: true
        type: choice
        default: status
        options:
          - status
          - migrate-dry-run
          - migrate-apply
          - office-status
          - office-credit-audit
          - sources-migrate-dry-run
          - sources-migrate-apply
          - credit-new
          - credit-reconcile
          - api-month-init
          - api-checkpoint
          - api-unknown-resolve
      confirm:
        description: "Type APLICAR to allow migrate-apply, sources-migrate-apply, credit-new or credit-reconcile apply (without it credit-reconcile is a dry run)"
        required: false
        type: string
        default: ""
      api_month:
        description: "api-month-init/api-checkpoint: current UTC month YYYY-MM"
        required: false
        type: string
        default: ""
      api_fixed_usd:
        description: "api-month-init: fixed monthly cost in USD (whole cents, 0-100)"
        required: false
        type: string
        default: ""
      api_external_spent_usd:
        description: "api-checkpoint: external spent USD this month outside the Factory/API ledger"
        required: false
        type: string
        default: ""
      api_external_reserved_usd:
        description: "api-checkpoint: external open/unknown holds USD"
        required: false
        type: string
        default: ""
      api_external_unknown_count:
        description: "api-checkpoint: number of external unknown reservations"
        required: false
        type: string
        default: ""
      api_hold_id:
        description: "api-unknown-resolve: empty = all unknown API-ledger reservations (+ tied unknown jobs); news = quarantined News hold"
        required: false
        type: string
        default: ""
      api_evidence:
        description: "api-checkpoint/api-unknown-resolve: evidence note (only its SHA-256 is stored/printed)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: factory-ops
  cancel-in-progress: false

jobs:
  factory-ops:
    if: github.repository == 'robertmanzanillag-jpg/blackops-reminder'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mask the API evidence note
        # Public logs echo each step's env; mask the evidence text before any step receives it.
        # Read from the event payload (never inlined into the script) so the note cannot inject shell.
        if: inputs.action == 'api-checkpoint'
        run: |
          evidence="$(jq -r '.inputs.api_evidence // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "${evidence//[[:space:]]/}" ]; then echo "::add-mask::$evidence"; fi
      - name: Refuse an unconfirmed apply
        if: (inputs.action == 'migrate-apply' || inputs.action == 'sources-migrate-apply' || inputs.action == 'credit-new') && inputs.confirm != 'APLICAR'
        run: |
          echo "this action requires confirm=APLICAR" >&2
          exit 1

      - name: Check out the reviewed production source
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.OFFICE_SOURCE_REF }}
          persist-credentials: false

      - name: Verify the reviewed scripts exist
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          # Only require the script(s) the chosen action runs.
          case "$ACTION" in
            status) test -f script/software-factory-status.ts ;;
            migrate-dry-run|migrate-apply) test -f script/software-factory-migrate.ts ;;
            office-status) test -f script/office-status.ts ;;
            office-credit-audit) test -f script/office-credit-audit.ts ;;
            sources-migrate-dry-run|sources-migrate-apply) test -f script/office-source-documents-migrate.ts ;;
            credit-new|credit-reconcile) test -f script/shared-credit-grant.ts ;;
            api-month-init|api-checkpoint) test -f script/factory-api-authority.ts && test -f script/factory-api-authority-cli.ts ;;
            api-unknown-resolve) test -f script/factory-api-unknown-resolve.ts ;;
            *) echo "unknown action" >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Diagnostics run on CPU; optional CUDA downloads must not block them.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Run ${{ inputs.action }}
        if: inputs.action == 'status' || inputs.action == 'migrate-dry-run' || inputs.action == 'migrate-apply'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL || secrets.OFFICE_DATABASE_URL }}
          SOFTWARE_FACTORY_OWNER_ID: ${{ secrets.FACTORY_OWNER_ID || secrets.OFFICE_OWNER_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status) node --import tsx script/software-factory-status.ts ;;
            migrate-dry-run) node --import tsx script/software-factory-migrate.ts ;;
            migrate-apply) node --import tsx script/software-factory-migrate.ts --apply ;;
            *) echo "unknown action" >&2; exit 1 ;;
          esac

      - name: Run office-status
        if: inputs.action == 'office-status'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
        run: node --import tsx script/office-status.ts

      - name: Audit office credit evidence (read-only)
        if: inputs.action == 'office-credit-audit'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          OPENAI_SHARED_CREDIT_CONFIG_JSON: ${{ secrets.OPENAI_SHARED_CREDIT_CONFIG_JSON }}
        run: node --import tsx script/office-credit-audit.ts

      - name: Run ${{ inputs.action }} (office source documents)
        if: inputs.action == 'sources-migrate-dry-run' || inputs.action == 'sources-migrate-apply'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "sources-migrate-apply" ]; then
            node --import tsx script/office-source-documents-migrate.ts --apply
          else
            node --import tsx script/office-source-documents-migrate.ts
          fi

      - name: Create the new shared credit ledger (credit-new)
        if: inputs.action == 'credit-new' && inputs.confirm == 'APLICAR'
        env:
          NODE_ENV: production
          # Same database as the office worker and the factory (they share the one ledger).
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/credit-new.out"
          # The tool's own failures are static codes on stderr (e.g. CREDIT_STORAGE_ALREADY_EXISTS).
          status=0
          node --import tsx script/shared-credit-grant.ts new --scope=openai-2026-11-19 --id=grant-2026-11-19-200 \
            --usd=200 --expires=2026-12-19T23:59:59Z --evidence=owner-approved-2026-11-19 \
            --model=gpt-6.1-sol --input-usd-per-million=2 --output-usd-per-million=10 \
            --pricing-valid-until=2026-12-31T00:00:00Z --apply > "$out" || status=$?
          # Print only the static status line; the CONFIG_JSON (grant) line is never echoed.
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
            for (const line of lines) {
              if (!line.startsWith("{")) continue;
              const parsed = JSON.parse(line);
              if (parsed.applied === true && parsed.status) console.log(JSON.stringify({ applied: true, status: parsed.status }));
            }' "$out"
          rm -f "$out"
          exit "$status"

      - name: Reconcile unknown shared credit reservations (credit-reconcile)
        if: inputs.action == 'credit-reconcile'
        env:
          NODE_ENV: production
          # Same database as the office worker and the factory (they share the one ledger).
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          SCOPE: ${{ vars.OFFICE_SHARED_CREDIT_SCOPE || 'openai-2026-11-19' }}
          CONFIRM: ${{ inputs.confirm }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Prints only consumer/kind/amount/createdAt and ledger totals; never keys or evidence ids.
          if [ "$CONFIRM" = "APLICAR" ]; then
            node --import tsx script/shared-credit-grant.ts reconcile --scope="$SCOPE" --reason="factory-ops-run-$RUN_ID" --apply
          else
            node --import tsx script/shared-credit-grant.ts reconcile --scope="$SCOPE" --reason="factory-ops-run-$RUN_ID"
          fi

      - name: Factory API authority (${{ inputs.action }})
        if: inputs.action == 'api-month-init' || inputs.action == 'api-checkpoint'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL || secrets.OFFICE_DATABASE_URL }}
          SOFTWARE_FACTORY_OWNER_ID: ${{ secrets.FACTORY_OWNER_ID || secrets.OFFICE_OWNER_ID }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          API_MONTH: ${{ inputs.api_month }}
          API_FIXED_USD: ${{ inputs.api_fixed_usd }}
          API_SPENT: ${{ inputs.api_external_spent_usd }}
          API_RESERVED: ${{ inputs.api_external_reserved_usd }}
          API_UNKNOWN: ${{ inputs.api_external_unknown_count }}
          FACTORY_API_EVIDENCE: ${{ inputs.api_evidence }}
        run: |
          set -euo pipefail
          apply=()
          if [ "$CONFIRM" = "APLICAR" ]; then apply=(--apply); fi
          if [ "$ACTION" = "api-month-init" ]; then
            node --import tsx script/factory-api-authority.ts month-init --month="$API_MONTH" --fixed-usd="$API_FIXED_USD" "${apply[@]}"
          else
            node --import tsx script/factory-api-authority.ts checkpoint --month="$API_MONTH" --external-spent-usd="$API_SPENT" \
              --external-reserved-usd="$API_RESERVED" --external-unknown-count="$API_UNKNOWN" "${apply[@]}"
          fi

      - name: Factory API unknown resolution (api-unknown-resolve)
        if: inputs.action == 'api-unknown-resolve'
        env:
          NODE_ENV: production
          AGENT_COUNCIL_STORAGE: postgres
          # The shared credit ledger and the Factory authority must be the same database.
          DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL || secrets.OFFICE_DATABASE_URL }}
          SOFTWARE_FACTORY_OWNER_ID: ${{ secrets.FACTORY_OWNER_ID || secrets.OFFICE_OWNER_ID }}
          SHARED_CREDIT_SCOPE: ${{ vars.OFFICE_SHARED_CREDIT_SCOPE || 'openai-2026-11-19' }}
          CONFIRM: ${{ inputs.confirm }}
          HOLD_ID: ${{ inputs.api_hold_id }}
          FACTORY_API_EVIDENCE: ${{ inputs.api_evidence }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$HOLD_ID" ]; then args+=("--hold-id=$HOLD_ID"); fi
          if [ "$CONFIRM" = "APLICAR" ]; then args+=(--apply); fi
          node --import tsx script/factory-api-unknown-resolve.ts "${args[@]}"
