name: Clippers streamers publish (cloud)

# Cloud download -> render -> Metricool for the streamer clip pages ($0 AI, no Mac).
# Reads approved rows from pending_actions (via the discovery state), re-checks the clip policy at publish
# time, downloads only the needed section (yt-dlp --impersonate chrome for YouTube), renders a <= 60 s
# vertical edit with ffmpeg + the bundled font, stages it as a temporary release asset on this repo (deleted
# after Metricool copies it) and schedules it through the existing Metricool adapter
# (script/clippers-portfolio-metricool.mjs). See docs/clippers-streamer-pages.md.
#
# Off by default. Enable: repository variable CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED = 'true'.
# Kill switch: repository variable CLIPPERS_STREAMER_CLOUD_KILL_SWITCH = 'true' stops every later run (checked by
# the job `if` and at script start). A run already in progress cannot see variable changes: cancel it in Actions.
# Cadence: after each "Office worker (cloud)" run, gated to minute < 15 between 09:00 and 19:59 New York time;
# the script also skips when its last run is < CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES (default 180) old.
# At most CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN (default 4) clips per run (no new clip after 20 min). Account lanes
# (default on): each clip goes to ONE account; 10/12/16/18/20 ET (weekends -30 %), 6-8/day once an account's weekly
# median passes 1k; Metricool drafts until then. Lanes off: legacy 5/day fan-out, slots 11:00-21:00. Explicit dispatches bypass the clock gate and the interval.

on:
  workflow_run:
    workflows: ["Office worker (cloud)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only (no upload, no Metricool); rendered clips are kept as a 1-day artifact"
        type: boolean
        default: false
      growth_only:
        description: "Run only the per-account growth loop (read-only Metricool analytics + best time)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLIPPERS_DRY_RUN_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || vars.CLIPPERS_STREAMER_CLOUD_DRY_RUN || 'false' }}

concurrency:
  group: clippers-streamers-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops-reminder' &&
      vars.CLIPPERS_STREAMERS_CLOUD_ENABLED != 'false' &&
      vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED == 'true' &&
      vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH != 'true' &&
      !(github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || inputs.growth_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # temporary media release assets only (GITHUB_TOKEN, no extra secret)
    steps:
      - name: Clock gate (New York 09:00-19:59, minute < 15, unless dispatched)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          minute=$((10#$(date -u +%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$hour" -ge 9 ] && [ "$hour" -le 19 ] && [ "$minute" -lt 15 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Outside the publish window (NY hour $hour, minute $minute); skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          # Production code only: the reviewed OFFICE_SOURCE_REF or main (also for dispatches on main).
          ref: ${{ vars.OFFICE_SOURCE_REF || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install ffmpeg and yt-dlp helpers
        if: steps.gate.outputs.run == 'true'
        env:
          YTDLP_FROM_PIP: ${{ vars.CLIPPERS_YTDLP_FROM_PIP || 'false' }}
          # Exact pins. bin/yt-dlp 2026.06.09 supports curl_cffi 0.10.x-0.15.x only.
          CURL_CFFI_VERSION: 0.13.0
          YTDLP_PIP_VERSION: ${{ vars.CLIPPERS_YTDLP_PIP_VERSION || '2026.06.09' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/curl-cffi" "curl-cffi==$CURL_CFFI_VERSION"
          echo "CLIPPERS_CURL_CFFI_DIR=$RUNNER_TEMP/curl-cffi" >> "$GITHUB_ENV"
          if [ "$YTDLP_FROM_PIP" = "true" ]; then
            if ! printf '%s' "$YTDLP_PIP_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then echo "::error::CLIPPERS_YTDLP_PIP_VERSION must be an exact version"; exit 1; fi
            python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/yt-dlp" "yt-dlp[default]==$YTDLP_PIP_VERSION"
            printf '#!/bin/sh\nPYTHONPATH="%s:%s" exec python3 -m yt_dlp "$@"\n' "$RUNNER_TEMP/yt-dlp" "$RUNNER_TEMP/curl-cffi" > "$RUNNER_TEMP/yt-dlp-bin"
            chmod +x "$RUNNER_TEMP/yt-dlp-bin"
            echo "CLIPPERS_YTDLP_BIN=$RUNNER_TEMP/yt-dlp-bin" >> "$GITHUB_ENV"
          fi
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext
          # Non-secret tool diagnostics for the public log.
          YTDLP="${CLIPPERS_YTDLP_BIN:-bin/yt-dlp}"
          if [ -f "$GITHUB_ENV" ]; then YTDLP="$(grep '^CLIPPERS_YTDLP_BIN=' "$GITHUB_ENV" | tail -1 | cut -d= -f2- || true)"; YTDLP="${YTDLP:-bin/yt-dlp}"; fi
          echo "yt-dlp: $("$YTDLP" --version 2>&1 | tail -1)"
          echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1 | cut -d' ' -f1-3)"
          echo "impersonate targets (chrome):"; PYTHONPATH="$RUNNER_TEMP/curl-cffi" "$YTDLP" --list-impersonate-targets 2>&1 | grep -iE 'chrome|curl_cffi|unavailable' | head -5 || true

      - name: Download, render, publish approved clips
        if: steps.gate.outputs.run == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED: ${{ vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED }}
          CLIPPERS_STREAMER_CLOUD_KILL_SWITCH: ${{ vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH || 'false' }}
          CLIPPERS_STREAMER_CLOUD_DRY_RUN: ${{ env.CLIPPERS_DRY_RUN_REQUESTED }}
          CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN: ${{ vars.CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN }}
          CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION: ${{ vars.CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION }}
          CLIPPERS_STREAMER_CLOUD_SLOTS: ${{ vars.CLIPPERS_STREAMER_CLOUD_SLOTS }}
          CLIPPERS_STREAMER_CLOUD_DESTINATIONS: ${{ vars.CLIPPERS_STREAMER_CLOUD_DESTINATIONS }}
          CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES || '180' }}
          CLIPPERS_STREAMER_CLIP_SECONDS: ${{ vars.CLIPPERS_STREAMER_CLIP_SECONDS }}
          CLIPPERS_STREAMER_CLOUD_PLATFORMS: ${{ vars.CLIPPERS_STREAMER_CLOUD_PLATFORMS }}
          CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES || '20' }}
          CLIPPERS_STREAMER_LANES_ENABLED: ${{ vars.CLIPPERS_STREAMER_LANES_ENABLED || 'true' }}
          CLIPPERS_STREAMER_LANE_AUTOPUBLISH: ${{ vars.CLIPPERS_STREAMER_LANE_AUTOPUBLISH || 'true' }}
          # Owner override (kill switch: set the repo variable to "off" / "" -> drafts + owner approval again).
          CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE: ${{ vars.CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE || 'default' }}
          CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS: ${{ vars.CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS || '6' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node --import tsx script/clippers-streamer-cloud-worker.mjs --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          else
            node --import tsx script/clippers-streamer-cloud-worker.mjs --respect-interval --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          fi

      - name: Keep dry-run renders for review (1 day)
        if: steps.gate.outputs.run == 'true' && env.CLIPPERS_DRY_RUN_REQUESTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clippers-dry-run-renders
          path: ${{ runner.temp }}/clippers-dry-run/*.mp4
          retention-days: 1
          if-no-files-found: ignore

  branch-dry-run:
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops-reminder' &&
      vars.CLIPPERS_STREAMERS_CLOUD_ENABLED != 'false' &&
      vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED == 'true' &&
      vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH != 'true' &&
      github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # no release assets: this path can never upload or publish
    steps:
      - name: Branch dispatches must be dry runs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::A dispatch on a branch other than main must set dry_run=true (render only; no upload, no Metricool, no state)."
            exit 1
          fi
      - name: Clock gate (New York 09:00-19:59, minute < 15, unless dispatched)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          minute=$((10#$(date -u +%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$hour" -ge 9 ] && [ "$hour" -le 19 ] && [ "$minute" -lt 15 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Outside the publish window (NY hour $hour, minute $minute); skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          # Testing a branch: render-only path, no Metricool token, read-only GITHUB_TOKEN.
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install ffmpeg and yt-dlp helpers
        if: steps.gate.outputs.run == 'true'
        env:
          YTDLP_FROM_PIP: ${{ vars.CLIPPERS_YTDLP_FROM_PIP || 'false' }}
          # Exact pins. bin/yt-dlp 2026.06.09 supports curl_cffi 0.10.x-0.15.x only.
          CURL_CFFI_VERSION: 0.13.0
          YTDLP_PIP_VERSION: ${{ vars.CLIPPERS_YTDLP_PIP_VERSION || '2026.06.09' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/curl-cffi" "curl-cffi==$CURL_CFFI_VERSION"
          echo "CLIPPERS_CURL_CFFI_DIR=$RUNNER_TEMP/curl-cffi" >> "$GITHUB_ENV"
          if [ "$YTDLP_FROM_PIP" = "true" ]; then
            if ! printf '%s' "$YTDLP_PIP_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then echo "::error::CLIPPERS_YTDLP_PIP_VERSION must be an exact version"; exit 1; fi
            python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/yt-dlp" "yt-dlp[default]==$YTDLP_PIP_VERSION"
            printf '#!/bin/sh\nPYTHONPATH="%s:%s" exec python3 -m yt_dlp "$@"\n' "$RUNNER_TEMP/yt-dlp" "$RUNNER_TEMP/curl-cffi" > "$RUNNER_TEMP/yt-dlp-bin"
            chmod +x "$RUNNER_TEMP/yt-dlp-bin"
            echo "CLIPPERS_YTDLP_BIN=$RUNNER_TEMP/yt-dlp-bin" >> "$GITHUB_ENV"
          fi
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext
          # Non-secret tool diagnostics for the public log.
          YTDLP="${CLIPPERS_YTDLP_BIN:-bin/yt-dlp}"
          if [ -f "$GITHUB_ENV" ]; then YTDLP="$(grep '^CLIPPERS_YTDLP_BIN=' "$GITHUB_ENV" | tail -1 | cut -d= -f2- || true)"; YTDLP="${YTDLP:-bin/yt-dlp}"; fi
          echo "yt-dlp: $("$YTDLP" --version 2>&1 | tail -1)"
          echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1 | cut -d' ' -f1-3)"
          echo "impersonate targets (chrome):"; PYTHONPATH="$RUNNER_TEMP/curl-cffi" "$YTDLP" --list-impersonate-targets 2>&1 | grep -iE 'chrome|curl_cffi|unavailable' | head -5 || true

      - name: Download, render, publish approved clips
        if: steps.gate.outputs.run == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED: ${{ vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED }}
          CLIPPERS_STREAMER_CLOUD_KILL_SWITCH: ${{ vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH || 'false' }}
          CLIPPERS_STREAMER_CLOUD_DRY_RUN: 'true'
          CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN: ${{ vars.CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN }}
          CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION: ${{ vars.CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION }}
          CLIPPERS_STREAMER_CLOUD_SLOTS: ${{ vars.CLIPPERS_STREAMER_CLOUD_SLOTS }}
          CLIPPERS_STREAMER_CLOUD_DESTINATIONS: ${{ vars.CLIPPERS_STREAMER_CLOUD_DESTINATIONS }}
          CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES || '180' }}
          CLIPPERS_STREAMER_CLIP_SECONDS: ${{ vars.CLIPPERS_STREAMER_CLIP_SECONDS }}
          CLIPPERS_STREAMER_CLOUD_PLATFORMS: ${{ vars.CLIPPERS_STREAMER_CLOUD_PLATFORMS }}
          CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES || '20' }}
          CLIPPERS_STREAMER_LANES_ENABLED: ${{ vars.CLIPPERS_STREAMER_LANES_ENABLED || 'true' }}
          CLIPPERS_STREAMER_LANE_AUTOPUBLISH: ${{ vars.CLIPPERS_STREAMER_LANE_AUTOPUBLISH || 'true' }}
          # Owner override (kill switch: set the repo variable to "off" / "" -> drafts + owner approval again).
          CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE: ${{ vars.CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE || 'default' }}
          CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS: ${{ vars.CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS || '6' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node --import tsx script/clippers-streamer-cloud-worker.mjs --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          else
            node --import tsx script/clippers-streamer-cloud-worker.mjs --respect-interval --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          fi

      - name: Keep dry-run renders for review (1 day)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clippers-dry-run-renders
          path: ${{ runner.temp }}/clippers-dry-run/*.mp4
          retention-days: 1
          if-no-files-found: ignore

  # Per-account growth loop in the cloud (no Mac): once a day before the first slot (New York 08:00-08:14),
  # or on a growth_only dispatch. Read-only Metricool analytics + best time; never writes a Metricool post.
  # Decisions (kill < 300 median after 6 posts, > 10k -> 3 follow-ups, > 100k -> double the creator,
  # auto-publish at weekly median >= 1k) are stored in the streamer ledger for the publish job and the office.
  growth:
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops-reminder' &&
      vars.CLIPPERS_STREAMERS_CLOUD_ENABLED != 'false' &&
      vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH != 'true' &&
      vars.CLIPPERS_STREAMER_LANES_ENABLED != 'false' &&
      (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.growth_only && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clock gate (New York 08:00-08:14, unless dispatched)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          minute=$((10#$(date -u +%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$hour" -eq 8 ] && [ "$minute" -lt 15 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ vars.OFFICE_SOURCE_REF || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Growth loop (read-only Metricool)
        if: steps.gate.outputs.run == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED: ${{ vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED }}
          CLIPPERS_STREAMER_CLOUD_KILL_SWITCH: ${{ vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH || 'false' }}
          CLIPPERS_STREAMER_CLOUD_DESTINATIONS: ${{ vars.CLIPPERS_STREAMER_CLOUD_DESTINATIONS }}
          CLIPPERS_STREAMER_LANES_ENABLED: 'true'
          # Owner override (kill switch: set the repo variable to "off" / "" -> drafts + owner approval again).
          CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE: ${{ vars.CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE || 'default' }}
        run: node --import tsx script/clippers-streamer-cloud-worker.mjs --growth-only
